apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk
  namespace: helpdesk
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: helpdesk.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpdesk-app
                port:
                  name: http
