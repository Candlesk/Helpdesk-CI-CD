env:
  contexts:
    - name: helpdesk
      urls:
        - "http://localhost:8000"
      includePaths:
        - "http://localhost:8000.*"
      excludePaths:
        - "http://localhost:8000/logout"
      authentication:
        method: form
        parameters:
          loginPageUrl: "http://localhost:8000/login"
          loginRequestUrl: "http://localhost:8000/login"
          loginRequestBody: "username={%username%}&password={%password%}"
        verification:
          method: response
          loggedInRegex: "\\QLogout\\E"
          loggedOutRegex: "\\QSign in\\E"
      sessionManagement:
        method: cookie
      users:
        - name: alice
          credentials:
            username: alice
            password: alice123

jobs:
  - type: spider
    parameters:
      context: helpdesk
      user: alice
      maxDuration: 1

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: activeScan
    parameters:
      context: helpdesk
      user: alice
      maxScanDurationInMins: 5
      maxRuleDurationInMins: 1

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-report.html
      reportTitle: HelpDesk authenticated DAST

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-report.json
