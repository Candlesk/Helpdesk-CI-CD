# GitLab CI equivalent of .github/workflows/security.yml
#
# Same six gates, same tools, same thresholds, same evidence artefacts.
# Runner requirement: Docker executor with Docker-in-Docker (privileged), or a
# shell runner with Docker. This file targets the dind setup used by GitLab.com
# shared runners and most university runners.
#
# NOTE: the GitHub Actions workflow is the one exercised in this repository.
# This file is the portable equivalent; validate it once on your runner
# (CI/CD -> Editor -> Validate, or `glab ci lint`).

stages:
  - sast
  - dependencies
  - secrets
  - iac
  - image
  - dast

variables:
  # Full clone: Gitleaks must scan every commit, not the last 20.
  GIT_DEPTH: "0"
  IMAGE: helpdesk:ci
  # dind without TLS. The daemon is only reachable inside the job network.
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

# Run on merge requests, on every branch push and on tags. The tag pipeline is
# what produces the red run on v0-vulnerable and the green run on v1-fixed.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true

# Shared setup for jobs that need a Docker daemon.
.dind:
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - docker info > /dev/null

# --------------------------------------------------------------------------
# 1. SAST — Semgrep (project rules + community rules)
# --------------------------------------------------------------------------
sast:
  stage: sast
  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]
  script:
    - semgrep scan --config auto --config ci/semgrep.yml
        --error --severity ERROR --metrics off

# --------------------------------------------------------------------------
# 2. Dependencies — Trivy filesystem (SCA)
# --------------------------------------------------------------------------
dependencies:
  stage: dependencies
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL
        --skip-dirs .git .

# --------------------------------------------------------------------------
# 3. Secrets — Gitleaks over the full history, output redacted
# --------------------------------------------------------------------------
secrets:
  stage: secrets
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --exit-code 1 --verbose

# --------------------------------------------------------------------------
# 4. IaC — Trivy config on the Kubernetes manifests
# --------------------------------------------------------------------------
iac:
  stage: iac
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy config --exit-code 1 --severity HIGH,CRITICAL deploy

# --------------------------------------------------------------------------
# 5. Container image — build then scan (fixable HIGH/CRITICAL only)
#    Named image_scan: "image" is a reserved global keyword in GitLab CI and
#    cannot be used as a job name.
# --------------------------------------------------------------------------
image_scan:
  stage: image
  extends: .dind
  image: docker:27
  script:
    - docker build -t "$IMAGE" .
    # The socket path exists inside the dind container, so this bind mount
    # works even though the repository does not.
    - docker run --rm
        -v /var/run/docker.sock:/var/run/docker.sock
        aquasec/trivy:latest image --exit-code 1 --ignore-unfixed
        --severity HIGH,CRITICAL "$IMAGE"

# --------------------------------------------------------------------------
# 6. DAST — authenticated ZAP + scripted authorization checks
# --------------------------------------------------------------------------
dast:
  stage: dast
  extends: .dind
  image: python:3.12-alpine
  needs: ["image_scan"]
  timeout: 30m
  variables:
    # The app is published on the dind container, reachable by its alias.
    BASE_URL: "http://docker:8000"
  before_script:
    - apk add --no-cache docker-cli docker-cli-compose curl
    - docker info > /dev/null
  script:
    # Test-only values; nothing here is a real secret.
    - cp .env.example .env
    - sed -i 's/__SET_A_RANDOM_DEV_PASSWORD__/ci-test-password/' .env
    - sed -i 's/__SET_A_RANDOM_SESSION_KEY__/ci-test-session-key/' .env
    - docker compose up -d --build
    - |
      healthy=0
      for _ in $(seq 1 60); do
        if docker compose exec -T app python -c \
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"; then
          healthy=1
          break
        fi
        sleep 2
      done
      if [ "$healthy" -ne 1 ]; then
        echo "Application did not become healthy"
        docker compose logs --no-color
        exit 1
      fi
    # Keep the ZAP container alive; the image entrypoint is zap.sh, so override it.
    - docker run -d --name zap --network host --entrypoint tail
        ghcr.io/zaproxy/zaproxy:stable -f /dev/null
    # Bind mounts resolve inside dind, so copy the config in with docker cp.
    - docker cp tests/dast/zap.yaml zap:/zap/wrk/zap.yaml
    # Keep the ZAP exit code, still copy the reports, then fail if needed.
    - |
      set +e
      docker exec zap zap.sh -cmd -autorun /zap/wrk/zap.yaml
      zap_code=$?
      set -e
      docker cp zap:/zap/wrk/zap-report.json tests/dast/zap-report.json || true
      docker cp zap:/zap/wrk/zap-report.html tests/dast/zap-report.html || true
      docker rm -f zap > /dev/null 2>&1 || true
      exit $zap_code
    - python3 tests/dast/idor_check.py
    - python3 tests/dast/check_report.py
  after_script:
    - docker compose logs --no-color || true
    - docker compose down -v || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/dast/zap-report.html
      - tests/dast/zap-report.json
